<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Return everything to my wallet</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M6 38 H16 V29 H26 V20 H36 V11 H42' fill='none' stroke='%2337b98d' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='42' cy='11' r='3.2' fill='%23e2b871'/%3E%3C/svg%3E"
    />
    <meta name="theme-color" content="#0c0b0a" />
    <style>
      :root {
        --color-ground: #0c0b0a;
        --color-panel: #141311;
        --color-hairline: #242220;
        --color-text: #f0ede8;
        --color-text-secondary: #9a938a;
        --color-text-muted: #6c655d;
        --color-accent: #37b98d;
        --color-accent-deep: #2e8f6e;
        --color-accent-deeper: #26654f;
        --color-gold: #d7b46a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--color-ground);
        color: var(--color-text);
        font-family: system-ui, sans-serif;
        display: flex;
        justify-content: center;
      }
      main {
        width: 100%;
        max-width: 620px;
        display: flex;
        flex-direction: column;
        gap: 22px;
        padding: 48px 20px 96px;
      }
      h1 {
        margin: 0;
        font-size: 30px;
        font-weight: 300;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0;
        color: var(--color-text-secondary);
      }
      .mono {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-variant-numeric: tabular-nums;
      }
      .panel {
        background: var(--color-panel);
        border: 1px solid var(--color-hairline);
        border-radius: 14px;
        padding: 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .line {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      label {
        color: var(--color-text-muted);
        font-size: 13px;
      }
      select,
      input {
        background: var(--color-ground);
        color: var(--color-text);
        border: 1px solid var(--color-hairline);
        border-radius: 10px;
        padding: 10px 12px;
        min-height: 44px;
        font: inherit;
        min-width: 0;
      }
      input {
        flex: 1;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
      }
      button {
        background: var(--color-accent);
        color: #0c0b0a;
        border: 0;
        border-radius: 10px;
        padding: 12px 18px;
        min-height: 44px;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      button[disabled] {
        opacity: 0.5;
        cursor: default;
      }
      .status {
        color: var(--color-gold);
      }
    </style>
  </head>
  <body>
    <main>
      <span style="display: inline-flex; align-items: center; gap: 9px">
        <svg width="22" height="22" viewBox="0 0 48 48" role="img" aria-label="Accrue">
          <path
            d="M6 38 H16 V29 H26 V20 H36 V11 H42"
            fill="none"
            stroke="var(--color-accent)"
            stroke-width="4"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle cx="42" cy="11" r="3.2" fill="#e2b871" />
        </svg>
        <span style="font-size: 17px; font-weight: 500; letter-spacing: -0.02em"
          >accrue</span
        >
      </span>
      <h1 id="title"></h1>
      <p id="intro"></p>

      <div class="panel">
        <div class="line">
          <label for="cluster" id="cluster-label"></label>
          <select id="cluster" data-testid="cluster">
            <option value="devnet">devnet</option>
            <option value="mainnet">mainnet</option>
          </select>
        </div>
        <div class="line">
          <label for="endpoint" id="endpoint-label"></label>
          <input id="endpoint" data-testid="endpoint" spellcheck="false" />
        </div>
      </div>

      <button id="connect" data-testid="connect"></button>
      <p class="status" id="status" data-testid="status"></p>
      <div id="positions" data-testid="positions"></div>
    </main>
    <script type="module" src="./rescue.js"></script>
  </body>
</html>
